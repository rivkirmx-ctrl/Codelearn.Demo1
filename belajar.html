<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jalur Belajar - CodeLearn</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .btn-module {
      background: #000;
      border: 1px solid #333;
      color: #888;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .btn-module:hover {
      color: #fff;
      border-color: #555;
    }
    .btn-module.active-mod {
      background: #9333ea;
      color: #fff;
      border-color: #c084fc;
    }

    /* TOMBOL & BADGE DEMO LOGIN DI NAVBAR */
    .btn-demo-login {
      background: #232334;
      border: 1px solid #9333ea;
      color: #fff;
      padding: 0.22rem 0.5rem;
      border-radius: 5px;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .btn-demo-login:hover { background: #2e1d42; }

    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: #232334;
      border: 1px solid #363650;
      padding: 0.18rem 0.5rem 0.18rem 0.25rem;
      border-radius: 15px;
    }
    .user-avatar-placeholder {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #9333ea;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: bold;
      border: 1px solid #a855f7;
    }
    .user-name-text {
      font-size: 0.72rem;
      color: #fff;
      font-weight: 500;
      max-width: 90px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-logout-icon {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.75rem;
      margin-left: 0.1rem;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">Code<span>Learn</span></a>
      <ul class="nav-links">
        <li><a href="belajar.html" class="active">Belajar</a></li>
        <li><a href="playground.html">Playground</a></li>
        <li><a href="quiz.html">Quiz</a></li>
        <li><a href="pricing.html">Harga</a></li>
      </ul>
      <div id="authNavContainer">
        <button class="btn-demo-login" onclick="loginDemo()">👤 Login Demo</button>
      </div>
    </div>
  </nav>

  <!-- Container Utama -->
  <main class="container" style="margin-top:2rem; margin-bottom:4rem; max-width:800px;">
    <div id="materiApp">
      <!-- Konten Materi Belajar Akan Dimuat Di Sini -->
      <div class="card" style="padding: 1.5rem; background: #161622; border: 1px solid #2a2a3c; border-radius: 8px;">
        <h3 style="color: #fff; margin-bottom: 0.5rem;">📚 Modul Belajar CodeLearn</h3>
        <p style="color: #aaa; font-size: 0.9rem; margin-bottom: 1rem;">Pilih materi dasar atau modul proyek Pro melalui navigasi atau halaman harga.</p>
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
          <a href="pricing.html" class="btn-module active-mod" style="text-decoration:none; display:inline-block;">⭐ Cek Status & Upgrade Premium</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Script Navbar & Login Demo -->
  <script>
    function checkDemoAuthBelajar() {
      const demoUser = localStorage.getItem('codelearn_demouser');
      const isPremium = localStorage.getItem('codelearn_is_premium') === 'true';
      const authContainer = document.getElementById('authNavContainer');

      if (!authContainer) return;

      if (demoUser) {
        const initial = demoUser.charAt(0).toUpperCase();
        authContainer.innerHTML = `
          <div class="user-profile-badge">
            <div class="user-avatar-placeholder">${initial}</div>
            <span class="user-name-text">${demoUser}</span>
            <button class="btn-logout-icon" onclick="logoutDemo()" title="Keluar">✕</button>
          </div>
        `;
      } else {
        authContainer.innerHTML = `
          <button class="btn-demo-login" onclick="loginDemo()">👤 Login Demo</button>
        `;
      }
    }

    window.loginDemo = function() {
      const nameInput = prompt("Masukkan Nama untuk Login Demo:", "Budi Santoso");
      if (nameInput && nameInput.trim() !== "") {
        localStorage.setItem('codelearn_demouser', nameInput.trim());
        alert(`🎉 Berhasil Login sebagai "${nameInput.trim()}"!`);
        checkDemoAuthBelajar();
      }
    };

    window.logoutDemo = function() {
      if (confirm("Keluar dari Akun Demo?")) {
        localStorage.removeItem('codelearn_demouser');
        localStorage.removeItem('codelearn_is_premium');
        alert("Kamu telah keluar.");
        checkDemoAuthBelajar();
      }
    };

    window.addEventListener('DOMContentLoaded', checkDemoAuthBelajar);
  </script>

  <!-- Script Imports -->
  <script src="js/materi-data.js"></script>
  <script src="js/belajar.js"></script>
</body>
</html>
